        .input-group-custom input, .input-group-custom select, .input-group-custom textarea { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: 0.3s; background: #f8fafc; }

    <div class="main-wrapper">
        <div class="form-container">
            <h2>ADMISSION 2026-27</h2>
            <form id="admissionForm">
                
                <!-- 1. Student Details -->
                <div class="section-title">1. Student Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Full Name *</label>
                        <input type="text" id="name" placeholder="Student's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Date of Birth *</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="col-md-12 input-group-custom">
                        <label>Passport Size Photo (Optional)</label>
                        <input type="file" id="photo" accept="image/*">
                    </div>
                </div>

                <!-- 2. Academic Details -->
                <div class="section-title">2. Academic Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Select Class *</label>
                        <select id="classSelect" required>
                            <option value="8th Standard">8th Standard</option>
                            <option value="9th Standard">9th Standard</option>
                            <option value="11th Standard (Plus One)">11th Standard (Plus One)</option>
                        </select>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Previous Qualification *</label>
                        <input type="text" id="qualification" placeholder="E.g., 7th Passed / 10th Passed" required>
                    </div>
                </div>

                <!-- 3. Family & Contact Details -->
                <div class="section-title">3. Family & Contact Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Father's Name *</label>
                        <input type="text" id="fatherName" placeholder="Father's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Mother's Name *</label>
                        <input type="text" id="motherName" placeholder="Mother's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Phone Number *</label>
                        <input type="tel" id="phone" placeholder="Mobile Number" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="whatsapp" placeholder="WhatsApp Number">
                    </div>
                    <div class="col-md-12 input-group-custom">
                        <label>Residential Address *</label>
                        <textarea id="address" rows="3" placeholder="Full Address with Pincode" required></textarea>
                    </div>
                </div>

                <!-- 4. Portal Account Setup -->
                <div class="section-title">4. Create Portal Account</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Email Address * (Used for Login & Alerts)</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Create a Password * (For Portal Login)</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Complete Registration</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("admissionForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Registering & Sending Email...";
            btn.disabled = true;

            const photoInput = document.getElementById("photo");
            let photoData = "../main/main/logo.png"; // Default photo if not uploaded

            if (photoInput.files && photoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processRegistration(e.target.result);
                };
                reader.readAsDataURL(photoInput.files[0]);
            } else {
                processRegistration(photoData);
            }

            function processRegistration(base64Photo) {
                // ഫോമിൽ നൽകിയ മുഴുവൻ വിവരങ്ങളും ശേഖരിക്കുന്നു
                const student = {
                    name: document.getElementById("name").value.trim(),
                    dob: document.getElementById("dob").value,
                    course: document.getElementById("classSelect").value,
                    qualification: document.getElementById("qualification").value.trim(),
                    fatherName: document.getElementById("fatherName").value.trim(),
                    motherName: document.getElementById("motherName").value.trim(),
                    phone: document.getElementById("phone").value.trim(),
                    whatsapp: document.getElementById("whatsapp").value.trim(),
                    address: document.getElementById("address").value.trim(),
                    email: document.getElementById("email").value.trim().toLowerCase(),
                    password: document.getElementById("password").value.trim(),
                    photo: base64Photo,
                    regNo: "MHD26A" + Math.floor(1000 + Math.random() * 9000),
                    admNo: "MH2026" + Math.floor(1000 + Math.random() * 9000)
                };

                let registeredList = JSON.parse(localStorage.getItem("allRegisteredStudents") || "[]");
                
                // ഈ ഇമെയിൽ നേരത്തെ രജിസ്റ്റർ ചെയ്തിട്ടുണ്ടോ എന്ന് പരിശോധിക്കുന്നു
                const exists = registeredList.find(s => s.email === student.email);
                if (exists) {
                    alert("This email is already registered! Please go to Candidate Login.");
                    window.location.href = "../candidate/login-candidate.html";
                    return;
                }

                // 1. ഡാറ്റ ബ്രൗസറിൽ സേവ് ചെയ്യുന്നു (ലോഗിൻ ചെയ്യാൻ വേണ്ടി)
                registeredList.push(student);
                localStorage.setItem("allRegisteredStudents", JSON.stringify(registeredList));

                // 2. EmailJS വഴി കുട്ടിക്ക് അഡ്മിഷൻ കൺഫർമേഷൻ മെസ്സേജ് അയക്കുന്നു
                // ഇവിടെ നിങ്ങളുടെ Service ID ചേർത്തിട്ടുണ്ട്, Template ID മാത്രം നൽകുക
                try {
                    emailjs.send("service_5z5t3m8", "template_xd3va49", {
                        student_name: student.name,
                        student_email: student.email,
                        course_name: student.course,
                        reg_id: student.regNo,
                        qualification: student.qualification,
                        father_name: student.fatherName,
                        phone: student.phone
                    }).then(function(response) {
                        console.log("Email Sent Successfully!", response.status, response.text);
                        finalize();
                    }, function(error) {
                        console.log("Email Failed to Send", error);
                        finalize(); // ഇമെയിൽ അയക്കാൻ കഴിഞ്ഞില്ലെങ്കിലും രജിസ്ട്രേഷൻ പൂർത്തിയാക്കി ലോഗിൻ പേജിലേക്ക് മാറ്റണം
                    });
                } catch(e) {
                    finalize();
                }

                function finalize() {
                    alert("Registration Successful!\nAn email confirmation has been sent.\nPlease login using your Email and Password.");
                    window.location.href = "../candidate/login-candidate.html"; // ലോഗിൻ പേജിലേക്ക് തിരിച്ചുവിടുന്നു
                }
            }
        });
    </script>
