<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Candidate Login | Manhajul Hidaya</title>
    
    <link rel="icon" type="image/png" sizes="48x48" href="../main/main/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-green: #059669; --bg-color: #f8fafc; --text-dark: #0f172a; --white: #ffffff; }
        body { background-color: var(--bg-color); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
        
        .top-navbar-green { background-color: var(--primary-green); padding: 8px 0; font-size: 13px; color: white; }
        .main-navbar { background-color: var(--white); padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
        
        main { flex: 1; display: flex; align-items: center; padding: 40px 0; }
        .login-wrapper { background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        
        .login-video-container { position: relative; width: 100%; height: 100%; min-height: 400px; background: #0f172a; }
        .login-video-container video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(15,23,42,0.2) 0%, rgba(5,150,105,0.8) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 30px; color: white; }
        
        .login-form-area { padding: 40px 35px; }
        .login-badge { background: #d1fae5; color: var(--primary-green); font-size: 11.5px; font-weight: 600; padding: 4px 12px; border-radius: 20px; display: inline-block; margin-bottom: 10px; }
        .login-title { color: var(--primary-green); font-weight: 700; font-size: 24px; margin-bottom: 25px; }
        
        .custom-input-group { background: #f1f5f9; border-radius: 10px; border: 1px solid #e2e8f0; display: flex; align-items: center; margin-bottom: 20px; overflow: hidden; }
        .custom-input-group .icon-box { padding: 12px 16px; color: var(--primary-green); }
        .custom-input-group input { border: none; background: transparent; width: 100%; padding: 12px 15px 12px 0; outline: none; }
        
        .btn-submit-login { background: var(--primary-green); color: white; font-weight: 600; padding: 12px; border-radius: 10px; border: none; width: 100%; cursor: pointer; text-transform: uppercase; margin-top: 10px; transition: 0.3s; }
        .btn-submit-login:hover { background: #047857; transform: translateY(-2px); }
        
        .custom-footer { background-color: #0f172a; color: #e2e8f0; padding: 20px 0; text-align: center; font-size: 13px; }
        
        @media (max-width: 767px) { .login-video-container { min-height: 200px; } .login-form-area { padding: 30px 20px; } }
    </style>
</head>
<body>

    <header class="top-navbar-green">
        <div class="container d-flex justify-content-between align-items-center font-weight-bold">
            MANHAJUL HIDAYA
            <a href="../index.html" class="text-white" style="text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="row login-wrapper no-gutters">
                        <div class="col-md-6 p-0 d-none d-md-block">
                            <div class="login-video-container">
                                <video autoplay loop muted playsinline><source src="../main/main/manhajul.webm" type="video/webm"></video>
                                <div class="video-overlay">
                                    <h3>STUDENT PORTAL</h3>
                                    <p>Manhajul Hidaya Da'wa Campus Admission & Learning Portal</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="login-form-area">
                                <span class="login-badge"><i class="fas fa-user-graduate mr-1"></i> Applicant</span>
                                <h4 class="login-title">Candidate Login</h4>
                                
                                <form id="loginForm">
                                    <label class="font-weight-bold text-dark" style="font-size:13px;">Email Address *</label>
                                    <div class="custom-input-group">
                                        <span class="icon-box"><i class="fa fa-envelope"></i></span>
                                        <input type="email" id="logEmail" placeholder="Enter registered email" required>
                                    </div>

                                    <label class="font-weight-bold text-dark" style="font-size:13px;">Password *</label>
                                    <div class="custom-input-group">
                                        <span class="icon-box"><i class="fas fa-lock"></i></span>
                                        <input type="password" id="logPass" placeholder="Enter password" required>
                                    </div>

                                    <button type="submit" class="btn-submit-login">Login Securely</button>
                                </form>

                                <div class="mt-4 text-center" style="font-size: 13px;">
                                    <span class="text-muted">New Candidate? </span>
                                    <a href="../admission/admission.html" style="color: var(--primary-green); font-weight: 600;">Register Here</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="custom-footer">
        <div class="container">© 2026 Al Manhajul Hidaya Da'wa Campus</div>
    </footer>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            const inputEmail = document.getElementById("logEmail").value.trim().toLowerCase();
            const inputPass = document.getElementById("logPass").value;

            // അഡ്മിഷൻ പേജിൽ നിന്നും സേവ് ചെയ്ത ഡാറ്റ എടുക്കുന്നു
            let registeredStudents = JSON.parse(localStorage.getItem("allRegisteredStudents") || "[]");

            // ഇമെയിലും പാസ്‌വേർഡും ഒത്തുനോക്കുന്നു
            const validUser = registeredStudents.find(s => s.email === inputEmail && s.password === inputPass);

            if (validUser) {
                // ശരിയാണെങ്കിൽ ഈ കുട്ടിയെ 'currentLoggedInStudent' ആയി സെറ്റ് ചെയ്യുന്നു
                localStorage.setItem("currentLoggedInStudent", JSON.stringify(validUser));
                window.location.href = "candidate-dashboard.html"; // ഡാഷ്‌ബോർഡിലേക്ക് തിരിച്ചുവിടുന്നു
            } else {
                alert("Invalid Email or Password! Please check your details or Register first.");
            }
        });
    </script>
</body>
</html>
