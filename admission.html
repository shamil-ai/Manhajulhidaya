    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ================= EMAILJS SCRIPT ================= -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    

    
    <link rel="stylesheet" href="css/admission.css">
</head>
<body>

    <div class="top-navbar-green">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="text-white font-weight-bold" style="text-transform: uppercase;">Manhajul Hidaya</div>
            <div class="social-links">
                <a href="#"><i class="fab fa-youtube"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </div>

    <nav class="navbar navbar-expand-lg navbar-light main-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="main/main/caligraphy-dars-g.png" alt="Logo" style="height: 40px;" onerror="this.src='https://via.placeholder.com/150x40?text=LOGO'">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="manhaj-projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="Manhajul-fest.html">Manhaj Festival</a></li>
                    <li class="nav-item active"><a class="nav-link" href="admission.html">Admission Form</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="form-container">
            <h2>ADMISSION 2026-27</h2>
            <form id="admissionForm">
                
                <!-- 1. Student Details -->
                <div class="section-title">1. Student Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Full Name *</label>
                        <input type="text" id="name" placeholder="Student's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Date of Birth *</label>
                        <input type="date" id="dob" required>
                    </div>
                    <div class="col-md-12 input-group-custom">
                        <label>Passport Size Photo (Optional)</label>
                        <input type="file" id="photo" accept="image/*">
                    </div>
                </div>

                <!-- 2. Academic Details -->
                <div class="section-title">2. Academic Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Select Class *</label>
                        <select id="classSelect" required>
                            <option value="8th Standard">8th Standard</option>
                            <option value="9th Standard">9th Standard</option>
                            <option value="11th Standard (Plus One)">11th Standard (Plus One)</option>
                        </select>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Previous Qualification *</label>
                        <input type="text" id="qualification" placeholder="E.g., 7th Passed / 10th Passed" required>
                    </div>
                </div>

                <!-- 3. Family & Contact Details -->
                <div class="section-title">3. Family & Contact Details</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Father's Name *</label>
                        <input type="text" id="fatherName" placeholder="Father's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Mother's Name *</label>
                        <input type="text" id="motherName" placeholder="Mother's Name" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Phone Number *</label>
                        <input type="tel" id="phone" placeholder="Mobile Number" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>WhatsApp Number</label>
                        <input type="tel" id="whatsapp" placeholder="WhatsApp Number">
                    </div>
                    <div class="col-md-12 input-group-custom">
                        <label>Residential Address *</label>
                        <textarea id="address" rows="3" placeholder="Full Address with Pincode" required></textarea>
                    </div>
                </div>

                <!-- 4. Portal Account Setup -->
                <div class="section-title">4. Create Portal Account</div>
                <div class="row">
                    <div class="col-md-6 input-group-custom">
                        <label>Email Address * (Used for Login & Alerts)</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="col-md-6 input-group-custom">
                        <label>Create a Password * (For Portal Login)</label>
                        <input type="password" id="password" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Complete Registration</button>
            </form>
        </div>
    </div>

    <footer class="custom-footer text-center">
        <div class="container">© 2026 Al Manhajul Hidaya Da'wa Campus | All Rights Reserved</div>
    </footer>

    <script src="js/admission.js"></script>
</body>
</html>
