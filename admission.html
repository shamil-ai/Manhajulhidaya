        .navbar-light .navbar-nav .nav-link { color: var(--text-dark) !important; font-weight: 500; font-size: 14px; padding: 10px 15px; }

        .page-header { background: linear-gradient(135deg, var(--primary-green) 0%, var(--light-green) 100%); color: white; padding: 50px 0; text-align: center; }

        .btn-submit { background-color: var(--primary-green); color: white; padding: 14px 30px; border-radius: 50px; font-weight: 600; border: none; width: 100%; transition: all 0.3s; }
        .btn-submit:hover { background-color: var(--light-green); }

        .custom-footer { background-color: #0f172a; color: #e2e8f0; padding: 30px 0 15px; margin-top: 60px; }

<body>

<section class="page-header">
    <div class="container">
        <h1>Admission Form 2026-27</h1>
        <p class="mb-0">Join Manhajul Hidaya Islamic Academy</p>
    </div>
</section>

<section class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="admission-card">
                <form id="admissionForm">
                    <div class="form-group mb-3">
                        <label class="form-label">Student Full Name *</label>
                        <input type="text" id="studentName" class="form-control" placeholder="Enter student's name" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 form-group mb-3">
                            <label class="form-label">Parent / Guardian Name *</label>
                            <input type="text" id="guardianName" class="form-control" placeholder="Guardian's name" required>
                        </div>
                        <div class="col-md-6 form-group mb-3">
                            <label class="form-label">Phone Number *</label>
                            <input type="tel" id="phoneNumber" class="form-control" placeholder="+91 Contact number" required>
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label class="form-label">Select Course / Class *</label>
                        <select id="courseSelect" class="form-control" required>
                            <option value="">Choose Course...</option>
                            <option value="Da'wa Course">Da'wa Course</option>
                            <option value="Hifz Course">Hifz Course</option>
                            <option value="Primary Islamic Studies">Primary Islamic Studies</option>
                        </select>
                    </div>

                    <div class="form-group mb-4">
                        <label class="form-label">Full Address *</label>
                        <textarea id="studentAddress" class="form-control" rows="3" placeholder="Place, Post, District..." required></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-submit">Submit Application</button>
                </form>
            </div>
        </div>
    </div>
</section>

<footer class="custom-footer text-center">
    <div class="container">
        <p class="mb-0">© 2026 Al Manhajul Hidaya. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>

<script>
    // VERCEL BACKEND URL - നിങ്ങളുടെ ശരിയായ ലിങ്ക് ഇവിടെ നൽകുക
    const BACKEND_URL = 'https://manhajulhidaya-v364.vercel.app';

    document.getElementById('admissionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Submitting...";
        submitBtn.disabled = true;

        const formData = {
            student_name: document.getElementById('studentName').value,
            guardian_name: document.getElementById('guardianName').value,
            phone: document.getElementById('phoneNumber').value,
            course: document.getElementById('courseSelect').value,
            address: document.getElementById('studentAddress').value
        };

        try {
            const res = await fetch(`${BACKEND_URL}/api/submit-admission`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const data = await res.json();
            
            if(data.success) {
                alert('Admission Application Submitted Successfully! ✅');
                this.reset();
            } else {
                alert('Error: ' + data.error);
            }
        } catch (err) {
            alert('Server Connection Failed. Please try again later.');
        }

        submitBtn.innerText = "Submit Application";
        submitBtn.disabled = false;
    });
</script>
</body>
