<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhajul Hidaya | Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; }
        .admin-header { background: #059669; color: white; padding: 20px 0; text-align: center; margin-bottom: 30px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .student-photo { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; }
        .login-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="container">
    <div class="login-container">
        <h3 class="text-center text-success font-weight-bold mb-4">Admin Login</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success btn-block font-weight-bold">Login</button>
            <p id="loginError" class="text-danger text-center mt-3" style="display: none;"></p>
        </form>
    </div>
</div>

<!-- Dashboard Section (Hidden by default) -->
<div id="dashboardSection" style="display: none;">
    <div class="admin-header d-flex justify-content-between align-items-center px-4">
        <div></div>
        <div>
            <h2 class="mb-0">Manhajul Hidaya - Admin Dashboard</h2>
            <p class="mb-0">Received Admissions List</p>
        </div>
        <div>
            <button onclick="logout()" class="btn btn-light btn-sm font-weight-bold text-danger">Logout</button>
        </div>
    </div>

    <div class="container">
        <div id="loading" class="text-center py-5">Loading applications...</div>
        <div id="applicationsList"></div>
    </div>
</div>

<script>
    const BACKEND_URL = 'https://manhajulhidaya.onrender.com';

    // Check if already logged in
    const token = localStorage.getItem('admin_token');
    if (token) {
        showDashboard(token);
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorEl = document.getElementById('loginError');

        fetch(`${BACKEND_URL}/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('admin_token', data.token);
                showDashboard(data.token);
            } else {
                errorEl.innerText = data.message || 'Invalid credentials';
                errorEl.style.display = 'block';
            }
        })
        .catch(err => {
            console.error(err);
            errorEl.innerText = 'Connection error!';
            errorEl.style.display = 'block';
        });
    });

    function showDashboard(token) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadAdmissions(token);
    }

    function loadAdmissions(token) {
        fetch(`${BACKEND_URL}/admin/admissions`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => {
            if (res.status === 403 || res.status === 401) {
                logout();
                throw new Error('Unauthorized');
            }
            return res.json();
        })
        .then(response => {
            const container = document.getElementById('applicationsList');
            document.getElementById('loading').style.display = 'none';
            
            if (!response.success || response.data.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No admissions found.</p>';
                return;
            }

            response.data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card p-4';
                card.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-2 text-center">
                            <img src="${item.photo || 'https://via.placeholder.com/60'}" class="student-photo mb-2 mb-md-0" alt="Photo">
                        </div>
                        <div class="col-md-7">
                            <h4 class="text-success font-weight-bold mb-1">${item.name}</h4>
                            <p class="mb-1 text-muted"><strong>Class:</strong> ${item.class_select} | <strong>DOB:</strong> ${item.dob}</p>
                            <p class="mb-1"><strong>Phone:</strong> ${item.phone} | <strong>WhatsApp:</strong> ${item.whatsapp || 'N/A'}</p>
                            <p class="mb-0 text-secondary"><small><strong>Email:</strong> ${item.email} | <strong>Address:</strong> ${item.address}</small></p>
                        </div>
                        <div class="col-md-3 text-md-right mt-3 mt-md-0">
                            <span class="badge badge-success p-2">Parent: ${item.father_name} / ${item.mother_name}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        })
        .catch(err => {
            console.error(err);
            document.getElementById('loading').innerText = 'Failed to load applications.';
        });
    }

    function logout() {
        localStorage.removeItem('admin_token');
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
    }
</script>

</body>
</html>
