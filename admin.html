<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhajul Hidaya | Admin Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafc; font-family: 'Poppins', sans-serif; }
        .admin-header { background: #059669; color: white; padding: 20px 0; text-align: center; margin-bottom: 20px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .student-photo { width: 60px; height: 60px; object-fit: cover; border-radius: 50%; }
        .login-container { max-width: 400px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .nav-pills .nav-link.active { background-color: #059669; }
        .nav-pills .nav-link { color: #059669; font-weight: 600; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="loginSection" class="container">
    <div class="login-container">
        <h3 class="text-center text-success font-weight-bold mb-4">Admin Login</h3>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success btn-block font-weight-bold">Login</button>
            <p id="loginError" class="text-danger text-center mt-3" style="display: none;"></p>
        </form>
    </div>
</div>

<!-- Dashboard Section -->
<div id="dashboardSection" style="display: none;">
    <div class="admin-header d-flex justify-content-between align-items-center px-4">
        <div></div>
        <div>
            <h2 class="mb-0">Manhajul Hidaya - Admin Dashboard</h2>
        </div>
        <div>
            <button onclick="logout()" class="btn btn-light btn-sm font-weight-bold text-danger">Logout</button>
        </div>
    </div>

    <div class="container mb-4">
        <ul class="nav nav-pills justify-content-center" id="pills-tab" role="tablist">
            <li class="nav-item mr-2">
                <a class="nav-link active" id="pills-admissions-tab" data-toggle="pill" href="#pills-admissions" role="tab">Admissions List</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="pills-contacts-tab" data-toggle="pill" href="#pills-contacts" role="tab">Contact Messages</a>
            </li>
        </ul>
    </div>

    <div class="container">
        <div class="tab-content" id="pills-tabContent">
            <!-- Admissions Tab -->
            <div class="tab-pane fade show active" id="pills-admissions" role="tabpanel">
                <div id="loadingAdmissions" class="text-center py-5">Loading admissions...</div>
                <div id="admissionsList"></div>
            </div>
            <!-- Contacts Tab -->
            <div class="tab-pane fade" id="pills-contacts" role="tabpanel">
                <div id="loadingContacts" class="text-center py-5">Loading messages...</div>
                <div id="contactsList"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const BACKEND_URL = 'https://manhajulhidaya.onrender.com';

    const token = localStorage.getItem('admin_token');
    if (token) {
        showDashboard(token);
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorEl = document.getElementById('loginError');

        fetch(`${BACKEND_URL}/admin/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                localStorage.setItem('admin_token', data.token);
                showDashboard(data.token);
            } else {
                errorEl.innerText = data.message || 'Invalid credentials';
                errorEl.style.display = 'block';
            }
        })
        .catch(err => {
            errorEl.innerText = 'Connection error!';
            errorEl.style.display = 'block';
        });
    });

    function showDashboard(token) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        loadAdmissions(token);
        loadContacts(token);
    }

    function loadAdmissions(token) {
        const container = document.getElementById('admissionsList');
        container.innerHTML = '';
        document.getElementById('loadingAdmissions').style.display = 'block';

        fetch(`${BACKEND_URL}/admin/admissions`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => { if (res.status === 401 || res.status === 403) logout(); return res.json(); })
        .then(response => {
            document.getElementById('loadingAdmissions').style.display = 'none';
            
            if (!response.success || response.data.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No admissions found.</p>';
                return;
            }

            response.data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card p-4';
                card.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-2 text-center">
                            <img src="${item.photo || 'https://via.placeholder.com/60'}" class="student-photo mb-2 mb-md-0" alt="Photo">
                        </div>
                        <div class="col-md-7">
                            <h4 class="text-success font-weight-bold mb-1">${item.name}</h4>
                            <p class="mb-1 text-muted"><strong>Class:</strong> ${item.class_select} | <strong>DOB:</strong> ${item.dob}</p>
                            <p class="mb-1"><strong>Phone:</strong> ${item.phone} | <strong>WhatsApp:</strong> ${item.whatsapp || 'N/A'}</p>
                            <p class="mb-0 text-secondary"><small><strong>Email:</strong> ${item.email} | <strong>Address:</strong> ${item.address}</small></p>
                        </div>
                        <div class="col-md-3 text-md-right mt-3 mt-md-0">
                            <span class="badge badge-success p-2 d-block mb-2">Parent: ${item.father_name} / ${item.mother_name}</span>
                            <button onclick="deleteAdmission(${item.id})" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function deleteAdmission(id) {
        if (!confirm('Are you sure you want to delete this admission?')) return;
        const token = localStorage.getItem('admin_token');

        fetch(`${BACKEND_URL}/admin/admissions/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadAdmissions(token);
            } else {
                alert('Failed to delete');
            }
        })
        .catch(err => alert('Error connecting to server'));
    }

    function loadContacts(token) {
        const container = document.getElementById('contactsList');
        container.innerHTML = '';
        document.getElementById('loadingContacts').style.display = 'block';

        fetch(`${BACKEND_URL}/admin/contacts`, {
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => { if (res.status === 401 || res.status === 403) logout(); return res.json(); })
        .then(response => {
            document.getElementById('loadingContacts').style.display = 'none';
            
            if (!response.success || response.data.length === 0) {
                container.innerHTML = '<p class="text-center text-muted">No messages found.</p>';
                return;
            }

            response.data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card p-4';
                card.innerHTML = `
                    <div class="row align-items-center">
                        <div class="col-md-9">
                            <h4 class="text-success font-weight-bold mb-1">${item.name}</h4>
                            <p class="mb-1 text-muted"><strong>Email:</strong> ${item.email} | <strong>Phone:</strong> ${item.phone}</p>
                            <p class="mb-0 text-dark"><strong>Message:</strong> ${item.message}</p>
                        </div>
                        <div class="col-md-3 text-md-right mt-3 mt-md-0">
                            <span class="badge badge-secondary p-2 d-block mb-2">${new Date(item.created_at).toLocaleDateString()}</span>
                            <button onclick="deleteContact(${item.id})" class="btn btn-outline-danger btn-sm"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        });
    }

    function deleteContact(id) {
        if (!confirm('Are you sure you want to delete this message?')) return;
        const token = localStorage.getItem('admin_token');

        fetch(`${BACKEND_URL}/admin/contacts/${id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` }
        })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadContacts(token);
            } else {
                alert('Failed to delete');
            }
        })
        .catch(err => alert('Error connecting to server'));
    }

    function logout() {
        localStorage.removeItem('admin_token');
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('loginSection').style.display = 'block';
    }
</script>

</body>
</html>
