<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Manhajul Hidaya</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: Arial, sans-serif; }
        .admin-header { background-color: #059669; color: white; padding: 20px 0; margin-bottom: 30px; }
        .nav-pills .nav-link.active { background-color: #059669; }
        .table-responsive { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<div class="admin-header text-center">
    <h2>Manhajul Hidaya Admin Dashboard</h2>
</div>

<div class="container">
    <!-- Tabs for Navigation -->
    <ul class="nav nav-pills mb-4 justify-content-center" id="adminTabs" role="tablist">
        <li class="nav-item">
            <a class="nav-link active" id="admission-tab" data-toggle="pill" href="#admissions" role="tab">Admission Details</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" id="photo-tab" data-toggle="pill" href="#photos" role="tab">Upload Fest Photos</a>
        </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content">
        
        <!-- 1. ADMISSIONS TAB -->
        <div class="tab-pane fade show active" id="admissions" role="tabpanel">
            <div class="table-responsive">
                <h4 class="text-success mb-3">Recent Admission Applications</h4>
                <button onclick="loadAdmissions()" class="btn btn-sm btn-outline-success mb-3">Refresh Data</button>
                
                <table class="table table-bordered table-striped">
                    <thead class="thead-dark">
                        <tr>
                            <th>ID</th>
                            <th>Student Name</th>
                            <th>Guardian</th>
                            <th>Phone</th>
                            <th>Course</th>
                            <th>Address</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="admissionTableBody">
                        <tr><td colspan="7" class="text-center">Loading admissions...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. PHOTO UPLOAD TAB -->
        <div class="tab-pane fade" id="photos" role="tabpanel">
            <div class="card p-4 shadow-sm mx-auto" style="max-width: 600px;">
                <h4 class="text-success mb-4">Upload Festival Photo</h4>
                <div class="form-group">
                    <label>Select Photo (Max 2MB)</label>
                    <input type="file" id="imageInput" accept="image/*" class="form-control-file">
                </div>
                <div class="form-group mb-4">
                    <label>Caption / Event Name</label>
                    <input type="text" id="photoCaption" placeholder="E.g., Alif Fest 2026 Opening" class="form-control">
                </div>
                <button onclick="uploadPhoto()" id="uploadBtn" class="btn btn-success px-4 w-100">Upload Photo</button>
                <p id="uploadStatus" class="mt-3 text-center font-weight-bold"></p>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// VERCEL BACKEND URL - നിങ്ങളുടെ ശരിയായ ലിങ്ക് ആണോ എന്ന് ഉറപ്പുവരുത്തുക
const BACKEND_URL = 'https://manhajulhidaya-v364.vercel.app';

// --------------------------------------------------------
// 1. Load Admissions Function
// --------------------------------------------------------
async function loadAdmissions() {
    const tbody = document.getElementById('admissionTableBody');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center">Loading...</td></tr>';

    try {
        const res = await fetch(`${BACKEND_URL}/admin/admissions`);
        const data = await res.json();

        if (data.success && data.data.length > 0) {
            tbody.innerHTML = '';
            data.data.forEach(app => {
                const date = new Date(app.created_at).toLocaleDateString('en-IN');
                tbody.innerHTML += `
                    <tr>
                        <td>#${app.id}</td>
                        <td class="font-weight-bold">${app.student_name}</td>
                        <td>${app.guardian_name}</td>
                        <td><a href="tel:${app.phone}">${app.phone}</a></td>
                        <td><span class="badge badge-success">${app.course}</span></td>
                        <td>${app.address}</td>
                        <td>${date}</td>
                    </tr>
                `;
            });
        } else {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No admission applications found.</td></tr>';
        }
    } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-danger">Failed to load data. Check connection.</td></tr>';
    }
}

// --------------------------------------------------------
// 2. Upload Photo Function
// --------------------------------------------------------
async function uploadPhoto() {
    const fileInput = document.getElementById('imageInput');
    const caption = document.getElementById('photoCaption').value;
    const statusText = document.getElementById('uploadStatus');
    const uploadBtn = document.getElementById('uploadBtn');

    if (fileInput.files.length === 0) return alert('ദയവായി ഒരു ഇമേജ് ഫയൽ തിരഞ്ഞെടുക്കുക.');
    if (fileInput.files[0].size > 2 * 1024 * 1024) return alert('ഫയൽ സൈസ് 2MB-യിൽ താഴെയായിരിക്കണം.');

    statusText.innerText = "Uploading... Please wait.";
    statusText.style.color = "blue";
    uploadBtn.disabled = true;

    const reader = new FileReader();
    reader.readAsDataURL(fileInput.files[0]);
    
    reader.onload = async function() {
        try {
            const res = await fetch(`${BACKEND_URL}/admin/upload-photo`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ photo_url: reader.result, caption: caption })
            });

            const data = await res.json();
            if (data.success) {
                statusText.innerText = "Photo Uploaded Successfully! ✅";
                statusText.style.color = "green";
                fileInput.value = '';
                document.getElementById('photoCaption').value = '';
            } else {
                statusText.innerText = "Error: " + data.error;
                statusText.style.color = "red";
            }
        } catch (err) {
            statusText.innerText = "Connection Failed!";
            statusText.style.color = "red";
        }
        uploadBtn.disabled = false;
    };
}

// പേജ് ലോഡ് ചെയ്യുമ്പോൾ അഡ്മിഷൻ ഡാറ്റ വിളിക്കാൻ
window.onload = loadAdmissions;
</script>
</body>
</html>
