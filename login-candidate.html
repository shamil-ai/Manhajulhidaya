<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Candidate Login | Manhajul Hidaya</title>
    
    <link rel="icon" type="image/png" sizes="48x48" href="main/main/logo.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    
    <link rel="stylesheet" href="css/login-candidate.css">
</head>
<body>

    <header class="top-navbar-green">
        <div class="container d-flex justify-content-between align-items-center font-weight-bold">
            MANHAJUL HIDAYA
            <a href="index.html" class="text-white" style="text-decoration: none;"><i class="fas fa-home"></i> Home</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-9">
                    <div class="row login-wrapper no-gutters">
                        <div class="col-md-6 p-0 d-none d-md-block">
                            <div class="login-video-container">
                                <video autoplay loop muted playsinline><source src="main/main/manhajul.webm" type="video/webm"></video>
                                <div class="video-overlay">
                                    <h3>STUDENT PORTAL</h3>
                                    <p>Manhajul Hidaya Da'wa Campus Admission & Learning Portal</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="login-form-area">
                                <span class="login-badge"><i class="fas fa-user-graduate mr-1"></i> Applicant</span>
                                <h4 class="login-title">Candidate Login</h4>
                                
                                <form id="loginForm">
                                    <label class="font-weight-bold text-dark" style="font-size:13px;">Email Address *</label>
                                    <div class="custom-input-group">
                                        <span class="icon-box"><i class="fa fa-envelope"></i></span>
                                        <input type="email" id="logEmail" placeholder="Enter registered email" required>
                                    </div>

                                    <label class="font-weight-bold text-dark" style="font-size:13px;">Password *</label>
                                    <div class="custom-input-group">
                                        <span class="icon-box"><i class="fas fa-lock"></i></span>
                                        <input type="password" id="logPass" placeholder="Enter password" required>
                                    </div>

                                    <button type="submit" class="btn-submit-login">Login Securely</button>
                                </form>

                                <div class="mt-4 text-center" style="font-size: 13px;">
                                    <span class="text-muted">New Candidate? </span>
                                    <a href="admission.html" style="color: var(--primary-green); font-weight: 600;">Register Here</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="custom-footer">
        <div class="container">© 2026 Al Manhajul Hidaya Da'wa Campus</div>
    </footer>

    
    <script src="js/login-candidate.js"></script>
</body>
</html>
