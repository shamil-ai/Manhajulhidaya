<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alif Gallery - Manhajul Hidaya</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Header Section -->
    <div class="bg-emerald-600 text-white py-12 px-6 text-center shadow-md">
        <h1 class="text-4xl font-bold mb-2">Alif Gallery</h1>
        <p class="text-emerald-100 text-lg">Explore event photos and memorable moments</p>
    </div>

    <!-- Back Button Section -->
    <div class="max-w-7xl mx-auto px-6 py-6">
        <a href="index.html" class="inline-flex items-center text-emerald-700 bg-white border border-emerald-200 px-5 py-2.5 rounded-full font-medium shadow-sm hover:bg-emerald-50 transition">
            ← Back to Fest Home
        </a>
    </div>

    <!-- Gallery Grid Container -->
    <div class="max-w-7xl mx-auto px-6 pb-16">
        <div id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Loading state placeholder -->
            <p class="text-gray-500 col-span-full text-center py-12 text-lg">Loading photos...</p>
        </div>
    </div>

    <!-- Script to Fetch Photos from Grs Repository Dynamically -->
    <script>
        // Grs റെപ്പോസിറ്ററിയിലെ gallery.json ഫയൽ ഫെച്ച് ചെയ്യുന്നു
        fetch('https://raw.githubusercontent.com/shamil-ai/Grs/main/manhajul/gallery.json')
          .then(response => {
            if (!response.ok) {
              throw new Error('Gallery data not found');
            }
            return response.json();
          })
          .then(data => {
            const container = document.getElementById('gallery-container');
            container.innerHTML = ''; // ലോഡിങ് ടെക്സ്റ്റ് ഒഴിവാക്കുന്നു

            let hasPhotos = false;

            // JSON ഡാറ്റ ലൂപ്പ് ചെയ്ത് ചിത്രങ്ങൾ എടുക്കുന്നു
            for (const folder in data) {
              if (Array.isArray(data[folder])) {
                data[folder].forEach(imagePath => {
                  hasPhotos = true;
                  
                  // പാത്ത് ക്ലീൻ ചെയ്ത് Grs റെപ്പോസിറ്ററിയുടെ ഡയറക്ട് Raw URL ഉണ്ടാക്കുന്നു
                  const cleanPath = imagePath.replace(/^manhajul\//, '');
                  const imageUrl = `https://raw.githubusercontent.com/shamil-ai/Grs/main/manhajul/${cleanPath}`;

                  // ഓരോ ഫോട്ടോയ്ക്കും കാർഡ് എലമെന്റ് നിർമ്മിക്കുന്നു
                  const card = document.createElement('div');
                  card.className = "bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 hover:shadow-md transition duration-300";

                  const img = document.createElement('img');
                  img.src = imageUrl;
                  img.alt = "Gallery Event Photo";
                  img.className = "w-full h-60 object-cover";
                  img.loading = "lazy"; // പെട്ടെന്ന് ലോഡ് ആകാൻ സഹായിക്കുന്നു

                  card.appendChild(img);
                  container.appendChild(card);
                });
              }
            }

            // ഫോട്ടോകൾ ഒന്നുമില്ലെങ്കിൽ മെസ്സേജ് കാണിക്കുക
            if (!hasPhotos) {
              container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-12 text-lg">No photos uploaded yet.</p>';
            }
          })
          .catch(error => {
            console.error('Error loading gallery:', error);
            const container = document.getElementById('gallery-container');
            container.innerHTML = '<p class="text-red-500 col-span-full text-center py-12 text-lg">Failed to load photos. Please try again later.</p>';
          });
    </script>
</body>
</html>
