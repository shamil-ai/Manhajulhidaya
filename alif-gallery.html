<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alif Gallery - Manhajul Hidaya</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
          theme: {
            extend: {
              colors: {
                'brand-green': '#0e9f6e', 
              }
            }
          }
        }
    </script>
    <style>
        /* ഫോട്ടോകൾ സ്ക്രോൾ ചെയ്യുമ്പോൾ വരുന്ന സ്ക്രോൾബാർ സ്റ്റൈൽ */
        #gallery-scroll-container::-webkit-scrollbar {
            width: 5px;
        }
        #gallery-scroll-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        #gallery-scroll-container::-webkit-scrollbar-thumb {
            background: #0e9f6e;
            border-radius: 3px;
        }

        /* സ്മൂത്ത് സൂം ആനിമേഷൻ (Touch & Hover Effect) */
        .img-card img {
            transition: transform 0.4s ease, opacity 0.3s ease;
        }
        .img-card:hover img, .img-card:active img {
            transform: scale(1.12); /* ചെറുതായി സൂം ആകുന്ന എഫക്റ്റ് */
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden text-gray-800">

    <!-- 1. FIXED HEADER & NAV (എപ്പോഴും മുകളിൽ നിൽക്കും) -->
    <header class="flex-none bg-brand-green text-white py-3 px-4 text-center shadow-md z-10">
        <h1 class="text-2xl sm:text-3xl font-bold">Alif Gallery</h1>
        <p class="text-emerald-100 text-xs sm:text-sm mt-0.5">Explore event photos and memorable moments</p>
        <div class="mt-2">
            <a href="index.html" class="inline-flex items-center text-xs text-brand-green bg-white px-3.5 py-1 rounded-full font-medium shadow hover:bg-emerald-50 transition">
                ← Back to Fest Home
            </a>
        </div>
    </header>

    <!-- 2. SCROLLABLE GALLERY AREA (ഫോട്ടോകൾ മാത്രം സ്ക്രോൾ ചെയ്യും) -->
    <main id="gallery-scroll-container" class="flex-1 overflow-y-auto p-2 sm:p-4">
        <div class="max-w-7xl mx-auto">
            <!-- ഫോണിൽ ഒരു വരിയിൽ 5 ഫോട്ടോകൾ വീതം (grid-cols-5) -->
            <div id="gallery-container" class="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-1.5 sm:gap-2">
                <p class="text-gray-500 col-span-full text-center py-12 text-sm">Loading photos...</p>
            </div>
        </div>
    </main>

    <!-- 3. FIXED FOOTER (എപ്പോഴും താഴെ നിൽക്കും) -->
    <footer class="flex-none bg-black text-gray-300 py-3 px-4 z-10 border-t border-gray-800 text-center text-xs">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-1.5">
            <div>
                <span class="font-bold text-white">Alif Fest</span> - Manhajul Hidaya
            </div>
            <div class="flex gap-4 text-gray-400">
                <a href="index.html" class="hover:text-white">Home</a>
                <a href="about.html" class="hover:text-white">About</a>
                <a href="contact.html" class="hover:text-white">Contact</a>
            </div>
            <p class="text-gray-500">&copy; 2026 Alif Fest</p>
        </div>
    </footer>

    <!-- 4. LIGHTBOX POPUP & DOWNLOAD BUTTON -->
    <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <!-- ക്ലോസ് ബട്ടൺ -->
        <button onclick="closeLightbox()" class="absolute top-4 right-4 text-white bg-white/20 hover:bg-white/40 rounded-full w-10 h-10 flex items-center justify-center text-2xl font-bold transition">
            &times;
        </button>

        <!-- വലുതായി കാണിക്കുന്ന ഫോട്ടോ -->
        <img id="lightbox-img" src="" alt="Enlarged View" class="max-h-[75vh] max-w-[95vw] object-contain rounded-lg shadow-2xl">

        <!-- ഡൗൺലോഡ് ബട്ടൺ -->
        <button id="download-btn" onclick="downloadCurrentPhoto()" class="mt-4 inline-flex items-center gap-2 text-sm bg-brand-green hover:bg-emerald-600 text-white font-medium px-5 py-2.5 rounded-full shadow-lg transition active:scale-95">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                <path d="M13 8V2H7v6H2l8 8 8-8h-5zM0 18h20v2H0v-2z"/>
            </svg>
            Download Photo
        </button>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        let currentPhotoUrl = '';

        // ഫോട്ടോ വലുതായി തുറക്കാൻ
        function openLightbox(src) {
            currentPhotoUrl = src;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        // ഫോട്ടോ പോപ്പ് അപ്പ് ക്ലോസ് ചെയ്യാൻ
        function closeLightbox() {
            const lightbox = document.getElementById('lightbox');
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }

        // ഫോട്ടോ ഡൗൺലോഡ് ചെയ്യാനുള്ള ഫങ്ഷൻ
        async function downloadCurrentPhoto() {
            if (!currentPhotoUrl) return;
            const downloadBtn = document.getElementById('download-btn');
            const originalText = downloadBtn.innerHTML;
            
            try {
                downloadBtn.innerText = "Downloading...";
                const response = await fetch(currentPhotoUrl);
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = currentPhotoUrl.split('/').pop() || 'photo.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (error) {
                // ഫെച്ച് വഴി ഡൗൺലോഡ് സാധിച്ചില്ലെങ്കിൽ ഡയറക്ട് ലിങ്ക് പുതിയ ടാബിൽ തുറക്കും
                window.open(currentPhotoUrl, '_blank');
            } finally {
                downloadBtn.innerHTML = originalText;
            }
        }

        // ഫോട്ടോയ്ക്ക് പുറത്തു ക്ലിക്ക് ചെയ്താൽ ക്ലോസ് ആകാൻ
        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLightbox();
            }
        });

        // Grs റെപ്പോസിറ്ററിയിൽ നിന്ന് ഫോട്ടോകൾ ഡൈനാമിക് ആയി ഫെച്ച് ചെയ്യുന്നു
        fetch('https://raw.githubusercontent.com/shamil-ai/Grs/main/manhajul/gallery.json?t=' + new Date().getTime())
          .then(response => {
            if (!response.ok) throw new Error('Gallery data not found');
            return response.json();
          })
          .then(data => {
            const container = document.getElementById('gallery-container');
            container.innerHTML = ''; 

            let hasPhotos = false;

            for (const folder in data) {
              if (Array.isArray(data[folder])) {
                data[folder].forEach(imagePath => {
                  if (/\.(jpg|jpeg|png|webp)$/i.test(imagePath)) {
                    hasPhotos = true;
                    
                    const cleanPath = imagePath.replace(/^manhajul\//, '');
                    const imageUrl = `https://raw.githubusercontent.com/shamil-ai/Grs/main/manhajul/${cleanPath}`;

                    // ഇമേജ് കാർഡ് സജ്ജീകരിക്കുന്നു (സൂം ആനിമേഷൻ ഉൾപ്പെടെ)
                    const card = document.createElement('div');
                    card.className = "img-card bg-white rounded overflow-hidden shadow-sm border border-gray-200 cursor-pointer aspect-square relative";
                    card.onclick = () => openLightbox(imageUrl);

                    const img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "Gallery Event Photo";
                    img.className = "w-full h-full object-cover";
                    img.loading = "lazy";

                    card.appendChild(img);
                    container.appendChild(card);
                  }
                });
              }
            }

            if (!hasPhotos) {
              container.innerHTML = '<p class="text-gray-500 col-span-full text-center py-12 text-sm">No valid photos uploaded yet.</p>';
            }
          })
          .catch(error => {
            console.error('Error loading gallery:', error);
            const container = document.getElementById('gallery-container');
            container.innerHTML = '<p class="text-red-500 col-span-full text-center py-12 text-sm">Failed to load photos. Please try again later.</p>';
          });
    </script>
</body>
</html>
