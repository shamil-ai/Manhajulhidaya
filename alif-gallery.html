<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gallery Viewer</title>
  <style>
    /* Modal / Lightbox Design */
    .modal {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      z-index: 1000;
    }

    /* Top Close Button */
    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      color: white; font-size: 28px;
      background: none; border: none; cursor: pointer;
    }

    /* Image Container & Disable Zoom Styling */
    .image-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      touch-action: pan-y; /* സൂം തടയാൻ */
    }

    .image-container img {
      max-width: 90%;
      max-height: 75vh;
      object-fit: contain;
      user-select: none;
      -webkit-user-drag: none;
      touch-action: none; /* ഇമേജ് സൂം ചെയ്യുന്നത് തടയുന്നു */
    }

    /* Bottom Control Bar */
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: #0d1117;
      color: white;
    }

    /* Left Side: Dynamic Counter */
    .photo-counter {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      min-width: 50px;
    }

    /* Center: Download Button */
    .download-btn {
      background-color: #059669;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    /* Right Side: Navigation Buttons */
    .nav-buttons {
      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: #21262d;
      color: white;
      border: 1px solid #30363d;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Modal UI -->
  <div id="galleryModal" class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>

    <div class="image-container" id="imageContainer">
      <img id="modalImg" src="" alt="Gallery Image" draggable="false">
    </div>

    <div class="modal-footer">
      <!-- 1. ഇടതുവശത്ത് ഓട്ടോമാറ്റിക് കൗണ്ട് (Dynamic Counter) -->
      <div class="photo-counter" id="photoCounter">1 / 1</div>

      <!-- Center Download Button -->
      <a id="downloadBtn" href="#" download class="download-btn">
        📥 Download Photo
      </a>

      <!-- 2. വലതുവശത്ത് നെക്സ്റ്റ് / പ്രിവിയസ് ബട്ടൺ -->
      <div class="nav-buttons">
        <button class="nav-btn" onclick="prevImage()">❮</button>
        <button class="nav-btn" onclick="nextImage()">❯</button>
      </div>
    </div>
  </div>

  <script>
    let images = [];
    let currentIndex = 0;

    // gallery.json-ൽ നിന്ന് ഫോട്ടോകൾ ഓട്ടോമാറ്റിക്കായി ലോഡ് ചെയ്യുന്നു
    async function loadGallery() {
      try {
        const response = await fetch('manhajul/gallery.json');
        const data = await response.json();
        images = data.manhajul || [];
        if (images.length > 0) {
          updateModal();
        }
      } catch (error) {
        console.error("Gallery JSON ലോഡ് ചെയ്യാൻ കഴിഞ്ഞില്ല:", error);
      }
    }

    // UI അപ്ഡേറ്റ് ചെയ്യുന്ന ഫങ്ഷൻ (കൗണ്ടും ഫോട്ടോയും)
    function updateModal() {
      if (images.length === 0) return;

      const imgPath = `manhajul/${images[currentIndex]}`;
      document.getElementById('modalImg').src = imgPath;
      document.getElementById('downloadBtn').href = imgPath;

      // ഇടതുവശത്തെ കൗണ്ട് ഓട്ടോമാറ്റിക്കായി അപ്‌ഡേറ്റ് ചെയ്യുന്നു (ഉദാഹരണത്തിന്: 1 / 15)
      document.getElementById('photoCounter').innerText = `${currentIndex + 1} / ${images.length}`;
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % images.length;
      updateModal();
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + images.length) % images.length;
      updateModal();
    }

    // 3. കൈകൊണ്ട് സ്വൈപ്പ് ചെയ്യാനുള്ള സംവിധാനം (Touch Swipe Logic)
    let touchStartX = 0;
    let touchEndX = 0;
    const imgContainer = document.getElementById('imageContainer');

    imgContainer.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    imgContainer.addEventListener('touchend', e => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, false);

    function handleSwipe() {
      if (touchEndX < touchStartX - 40) {
        nextImage(); // ഇടത്തോട്ട് സ്വൈപ്പ് ചെയ്യുമ്പോൾ അടുത്ത ഫോട്ടോ
      }
      if (touchEndX > touchStartX + 40) {
        prevImage(); // വലത്തോട്ട് സ്വൈപ്പ് ചെയ്യുമ്പോൾ മുൻപത്തെ ഫോട്ടോ
      }
    }

    // 4. സൂം ചെയ്യപ്പെടാതിരിക്കാൻ (Pinch-to-zoom prevention)
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // തുടക്കത്തിൽ ഫോട്ടോകൾ ലോഡ് ചെയ്യുക
    loadGallery();
  </script>
</body>
</html>
